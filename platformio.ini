; PlatformIO Project Configuration File
; Robot Arm 5-DOF - ESP32
; Kendali murni dari HP via WiFi (Access Point + WebSocket)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
board_build.partitions = huge_app.csv   ; app 3 MB (perlu untuk mesh STL gzip; OTA tidak dipakai)

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    links2004/WebSockets @ ^2.4.1